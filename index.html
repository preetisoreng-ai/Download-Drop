<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Package Drop</title>
    <meta
      name="description"
      content="An interaction experiment: a download becomes a package parachuting down to you. Downloading means something is coming to you."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sky: "#F7F7F7",
              ink: "#0E0E12",
              muted: "#9A9AA3",
              peach: "#FFB36B",
              rose: "#FF6F91",
              violet: "#6E6BFF",
            },
            fontFamily: {
              sans: ['"Inter"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --sky: #f8f8f8;
        --black: #121212;
        --violet: #7a42f7;
        --lime: #c6fa2c;
        --ink: #0e0e12;
        --muted: #9a9aa3;
        --muted-2: #5e5e67;
        --sheet: #ffffff;
        --tile: #f3f3f6;

        --clay: #ff5f73; /* warning */
        --hair: rgba(14, 14, 18, 0.08);
        --hair-2: rgba(14, 14, 18, 0.14);
        /* the one vivid accent, sampled from the reference: peach → rose → violet */
        --grad: linear-gradient(120deg, #ffb36b 0%, #ff6f91 46%, #6e6bff 100%);
        --card-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 0 0 1px rgba(14, 14, 18, 0.04),
          0 16px 36px -18px rgba(40, 40, 80, 0.28);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        color: var(--ink);
        background: #f7f7f7;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "ss01", "cv11";
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      ::selection {
        background: var(--ink);
        color: var(--sky);
      }
      button {
        font: inherit;
        color: inherit;
      }
      p,
      h1,
      h2 {
        margin: 0;
      }
      /* small grey uppercase labels, as in the reference widgets */
      .label {
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .display {
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.04;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      :focus-visible {
        outline: 2px solid var(--violet);
        outline-offset: 3px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- Device: a framed phone on desktop, the real screen on phones ---------- */
      .stage {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .device {
        position: relative;
        width: 412px;
        height: 866px;
        /* iPhone 15, Pink: a satin pink aluminium band around a black glass border */
        padding: 6.5px;
        border-radius: 64px;
        border: 4.5px solid transparent;
        background:
          linear-gradient(#0c0c0d, #0c0c0d) padding-box,
          linear-gradient(145deg, #f8dadd 0%, #e6b3b9 34%, #f5cfd3 58%, #d89ea6 100%) border-box;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 0 0.5px rgba(150, 100, 104, 0.45),
          0 60px 90px -50px rgba(120, 70, 76, 0.35),
          0 24px 40px -24px rgba(0, 0, 0, 0.2);
        transform-origin: 0 0;
      }
      .device::before,
      .device::after {
        content: "";
        position: absolute;
        width: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #d39aa2, #efc4c9);
      }
      .device::before {
        left: -7.5px;
        top: 176px;
        height: 100px;
        box-shadow: 0 -60px 0 0 #dfaab1;
      }
      .device::after {
        right: -7.5px;
        top: 230px;
        height: 96px;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 53px;
        overflow: hidden;
        isolation: isolate;
        background: var(--sky);
        touch-action: none;
      }
      .statusbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 30px 0 40px;
        font:
          600 16px/1 -apple-system,
          "SF Pro Text",
          "Inter",
          sans-serif;
        letter-spacing: -0.01em;
        pointer-events: none;
      }
      .island {
        position: absolute;
        left: 50%;
        top: 11px;
        width: 124px;
        height: 36px;
        margin-left: -62px;
        border-radius: 20px;
        background: #000;
      }
      .home-ind {
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 136px;
        height: 5px;
        margin-left: -68px;
        border-radius: 3px;
        background: var(--ink);
        z-index: 30;
      }
      @media (max-width: 639px) {
        html,
        body {
          background: var(--sky);
        }
        .stage {
          padding: 0;
          display: block;
        }
        .device {
          width: 100%;
          height: 100dvh;
          padding: 0;
          border-radius: 0;
          background: none;
          box-shadow: none;
          border: 0;
        }
        .device::before,
        .device::after,
        .statusbar,
        .home-ind {
          display: none;
        }
        .screen {
          border-radius: 0;
        }
      }

      /* ---------- Scene ---------- */
      .scene,
      .scene canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .scene svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .scene {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .scene.on {
        opacity: 1;
      }
      .runway-band {
        /* The polygons begin at the central landing point. Reveal their length
           toward the bottom edge instead of scaling/dropping them from above. */
        clip-path: inset(0 0 100% 0);
        will-change: clip-path;
      }
      .scene.on .runway-band {
        animation: runwayUnfurl 1.35s cubic-bezier(0.16, 0.82, 0.2, 1) forwards;
      }
      /* Wait for the cover stripes to clear, then sweep out from the centre. */
      .scene.on .runway-violet { animation-delay: 0.78s; }
      .scene.on .runway-black { animation-delay: 0.84s; }
      .scene.on .runway-lime { animation-delay: 0.9s; }
      @keyframes runwayUnfurl {
        from { clip-path: inset(0 0 100% 0); }
        to { clip-path: inset(0 0 0 0); }
      }
      .ground-fade {
        transition: opacity 0.6s ease;
      }

      /* ---------- Card view ---------- */
      .card-view {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        padding: calc(max(54px, env(safe-area-inset-top)) + 22px) 18px
          calc(max(24px, env(safe-area-inset-bottom)) + 16px);
        background: #ffffff;
        transition: visibility 0s linear 0.9s;
      }
      .card-view::before,
      .card-view::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
        transition: transform 0.9s cubic-bezier(0.72, 0, 0.18, 1);
        will-change: transform;
      }
      .card-view::before {
        left: 31.5%;
        width: 37%;
        background: var(--violet);
      }
      .card-view::after {
        left: 68.5%;
        width: 31.5%;
        background: var(--lime);
      }
      .card-view > * {
        position: relative;
        z-index: 1;
        transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.6, 0, 0.3, 1);
      }
      .card-view.away {
        visibility: hidden;
        pointer-events: none;
      }
      .card-view.away::before { transform: translateY(-105%); }
      .card-view.away::after { transform: translateY(105%); }
      .card-view.away > * {
        opacity: 0;
        transform: translateY(18px);
      }
      /* wide-tracked kicker, as in the reference */
      .kicker {
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--black);
        padding: 0 6px;
        margin-top: 34px;
      }
      .card-view h1 {
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.02;
        margin-top: 12px;
        padding: 0 6px;
        color: var(--black);
      }
      .card-view h1 .line2 {
        display: block;
      }
      /* letters change colour where they cross a band: the gradient is sized to the whole
         screen and offset to each word's position (set in JS), then clipped to the text */
      .band {
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        background-repeat: no-repeat;
      }
      .band.v {
        background-image: linear-gradient(90deg, var(--violet) 0 31.5%, #ffffff 31.5% 68.5%, var(--black) 68.5% 100%);
      }
      .band.l {
        background-image: linear-gradient(90deg, var(--violet) 0 31.5%, var(--lime) 31.5% 68.5%, var(--black) 68.5% 100%);
      }
      .file-block {
        margin: auto 0;
        padding-bottom: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .file-block .doc {
        width: 78px;
        height: 97px;
        filter:
          drop-shadow(0 9px 8px rgba(18, 18, 18, 0.26))
          drop-shadow(0 21px 24px rgba(18, 18, 18, 0.2));
        transition:
          transform 0.7s cubic-bezier(0.6, 0, 0.3, 1),
          opacity 0.4s ease 0.25s;
      }
      .file-block .name {
        margin-top: 22px;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.02em;
        color: var(--black);
        word-break: break-all;
      }
      .file-block .meta {
        margin-top: 6px;
        font-weight: 500;
        font-size: 13.5px;
        color: rgba(18, 18, 18, 0.62);
      }
      /* solid download pill */
      .dl {
        margin-top: 30px;
        width: 268px;
        height: 60px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        overflow: hidden;
        display: flex;
        cursor: pointer;
        background: #000;
        box-shadow: 0 18px 30px -18px rgba(18, 18, 18, 0.55);
        transition: transform 0.4s cubic-bezier(0.34, 1.5, 0.64, 1);
      }
      .dl .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #000;
        color: #fff;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      @keyframes downloadNudge {
        0%, 100% { transform: translateY(0); }
        36% { transform: translateY(3px); }
        58% { transform: translateY(-1.5px); }
        76% { transform: translateY(1px); }
      }
      .dl:hover:not(:disabled) .main svg,
      .dl:focus-visible:not(:disabled) .main svg {
        animation: downloadNudge 0.72s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
      }
      .dl:active {
        transform: scale(0.97);
      }
      .dl:disabled {
        opacity: 0.45;
        cursor: default;
      }

      /* ---------- HUD ---------- */
      .hud {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(max(54px, env(safe-area-inset-top)) + 12px);
        z-index: 12;
        display: flex;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .hud.on {
        opacity: 1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        max-width: calc(100% - 32px);
        padding: 12px 18px 12px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow: var(--card-shadow);
      }
      .chip .pulse {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--violet);
      }
      .chip .label {
        color: #a8a5bb;
        letter-spacing: 0.08em;
      }
      .chip .divider {
        flex: none;
        width: 1px;
        height: 18px;
        background: rgba(122, 66, 247, 0.45);
      }
      .chip .what {
        font-weight: 500;
        font-size: 14px;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 12;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fff;
        box-shadow: var(--card-shadow);
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        will-change: transform;
      }
      .tag.on {
        opacity: 1;
      }
      .tag b {
        font-weight: inherit;
      }

      /* ---------- Panels ---------- */
      .panel {
        position: absolute;
        left: 16px;
        right: 16px;
        top: calc(max(54px, env(safe-area-inset-top)) + 16px);
        z-index: 14;
        padding: 22px 20px 20px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.9);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        box-shadow: var(--card-shadow);
        text-align: center;
        animation: fadeUp 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      .panel h2 {
        font-size: 30px;
        margin: 10px 0 12px;
      }
      .panel .lede {
        font-size: 14.5px;
        line-height: 1.5;
        color: var(--muted-2);
        max-width: 30ch;
        margin: 0 auto;
      }
      .file-row {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 2px;
        padding: 10px 16px 10px 10px;
        border-radius: 20px;
        background: var(--tile);
        text-align: left;
        max-width: 100%;
      }
      .file-row svg {
        flex: none;
      }
      .file-row .n {
        font-weight: 600;
        font-size: 14.5px;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .btn {
        height: 50px;
        padding: 0 22px;
        border-radius: 18px;
        border: 0;
        background: var(--tile);
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        text-decoration: none;
        color: var(--ink);
        transition:
          transform 0.4s cubic-bezier(0.34, 1.5, 0.64, 1),
          background 0.25s ease,
          filter 0.25s ease;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.primary {
        background: var(--black);
        color: #fff;
        box-shadow: 0 14px 24px -14px rgba(18, 18, 18, 0.55);
      }
      .btn.primary:hover {
        filter: brightness(1.05);
      }
      .btn:not(.primary):hover {
        background: #ebebf0;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: -1px;
        background: var(--lime);
        box-shadow: 0 0 0 1.5px var(--black);
      }
      .dot.warn {
        background: var(--clay);
      }

      @media (prefers-reduced-motion: reduce) {
        .card-view,
        .file-block .doc,
        .scene {
          transition-duration: 0.01s;
        }
        .card-view::before,
        .card-view::after,
        .card-view > * {
          transition-duration: 0.01s;
        }
        .scene.on .runway-band {
          animation-duration: 0.01s;
          animation-delay: 0s;
        }
        .dl:hover .main svg,
        .dl:focus-visible .main svg {
          animation: none;
        }
      }

      /* Reference fidelity pass: a high-contrast black iPhone frame, generous editorial
         spacing, and the sharper monochrome / violet / acid-lime visual language. */
      @media (min-width: 640px) {
        .stage {
          padding: 8px;
          background: #f4f4f4;
        }
        .device {
          padding: 5px;
          border: 0;
          border-radius: 62px;
          background: #050505;
          box-shadow:
            inset 0 0 0 1px rgba(255, 255, 255, 0.12),
            0 0 0 1px rgba(0, 0, 0, 0.72),
            0 26px 54px -26px rgba(0, 0, 0, 0.28);
        }
        .device::before,
        .device::after {
          background: linear-gradient(90deg, #090909, #3a3a3a 58%, #090909);
        }
        .device::before { left: -3px; }
        .device::after { right: -3px; }
        .screen { border-radius: 55px; }
      }
      .card-view {
        padding-left: 26px;
        padding-right: 26px;
      }
      .kicker {
        margin-top: 38px;
        padding: 0;
        font-size: 10px;
        letter-spacing: 0.36em;
      }
      .card-view h1 {
        margin-top: 8px;
        padding: 0;
        font-size: 45px;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      .file-block { padding-bottom: 72px; }
      .file-block .doc { width: 86px; height: 107px; }
      .file-block .name {
        margin-top: 24px;
        font-size: 18px;
        font-weight: 650;
      }
      .file-block .meta {
        margin-top: 8px;
        color: rgba(18, 18, 18, 0.56);
      }
      .dl {
        width: 286px;
        height: 62px;
        margin-top: 36px;
        box-shadow: none;
      }
      .dl .main { font-size: 18px; }
      .chip {
        padding: 13px 19px 13px 14px;
        box-shadow: 0 12px 30px -20px rgba(0, 0, 0, 0.35);
      }
      .chip .pulse {
        width: 10px;
        height: 10px;
        background: linear-gradient(135deg, #d58cff, var(--violet));
        box-shadow: 0 0 12px rgba(122, 66, 247, 0.32);
      }
      .chip .label {
        font-size: 11px;
        letter-spacing: 0.07em;
      }
      .tag {
        padding: 7px 13px;
        font-size: 14px;
        box-shadow: 0 12px 28px -18px rgba(0, 0, 0, 0.34);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 40px; font-family: sans-serif">
        Package Drop needs JavaScript to open the sky.
      </p>
    </noscript>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

    <!-- Sound: wind is band-passed noise that rises with fall speed; the canopy flutters on a
         slow LFO; snap, thud and crinkle are short shaped bursts. All quiet on purpose. -->
    <script>
      window.Sound = (function () {
        var ctx = null,
          master = null,
          noise = null,
          wind = null,
          flutter = null;
        function ensure() {
          if (!ctx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            try {
              ctx = new AC({ latencyHint: "interactive" });
            } catch (e) {
              ctx = new AC();
            }
            master = ctx.createGain();
            master.gain.value = 1;
            var comp = ctx.createDynamicsCompressor();
            comp.threshold.value = -18;
            comp.ratio.value = 4;
            master.connect(comp);
            comp.connect(ctx.destination);
            var rate = ctx.sampleRate;
            noise = ctx.createBuffer(1, rate * 2, rate);
            var d = noise.getChannelData(0);
            for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            // wind bed
            var ws = ctx.createBufferSource();
            ws.buffer = noise;
            ws.loop = true;
            var wf = ctx.createBiquadFilter();
            wf.type = "bandpass";
            wf.frequency.value = 500;
            wf.Q.value = 0.7;
            var wg = ctx.createGain();
            wg.gain.value = 0;
            ws.connect(wf);
            wf.connect(wg);
            wg.connect(master);
            ws.start();
            wind = { f: wf, g: wg };
            // canopy flutter: low noise, amplitude-wobbled
            var fs = ctx.createBufferSource();
            fs.buffer = noise;
            fs.loop = true;
            var ff = ctx.createBiquadFilter();
            ff.type = "lowpass";
            ff.frequency.value = 260;
            var fg = ctx.createGain();
            fg.gain.value = 0;
            var am = ctx.createGain();
            am.gain.value = 0.5;
            var lfo = ctx.createOscillator();
            lfo.frequency.value = 7;
            var la = ctx.createGain();
            la.gain.value = 0.5;
            lfo.connect(la);
            la.connect(am.gain);
            fs.connect(ff);
            ff.connect(am);

              if (S.mode === "land") {

                  "M" +
                  ax.toFixed(1) +
                  "," +
                  ay.toFixed(1) +
                  " Q" +
                  ((ax + bxp) / 2).toFixed(1) +
                  "," +
                  (Math.max(ay, byp) + sag).toFixed(1) +
                  " " +
                  bxp.toFixed(1) +
                  "," +
                  byp.toFixed(1) +
                  " ";
              } else
                d +=
                  "M" +
                  ax.toFixed(1) +
                  "," +
                  ay.toFixed(1) +

                  bxp.toFixed(1) +
                  "," +
                  byp.toFixed(1) +

          c2.setTransform(dpr, 0, 0, dpr, 0, 0);

              k = p.life / p.max;

              var lg = c2.createLinearGradient(p.x, p.y, p.x, p.y + p.len);
              lg.addColorStop(0, "rgba(18,18,18," + al + ")");
              lg.addColorStop(1, "rgba(18,18,18,0)");

          var g = geo();
          // runway: three bands converging on the landing pad (fractions measured from the reference)
          var tY = g.zoneY / g.H;
          var P = function (pts) {
            return pts.map(function (q) { return (q[0] * g.W).toFixed(1) + "," + (q[1] * g.H).toFixed(1); }).join(" ");
          };
          els.roadB.setAttribute("points", P([[0.364, tY], [0.416, tY], [0.074, 1.01], [0, 1.01], [0, 0.84]]));
          els.roadV.setAttribute("points", P([[0.421, tY], [0.53, tY], [0.814, 1.01], [0.104, 1.01]]));
          els.roadL.setAttribute("points", P([[0.537, tY], [0.58, tY], [1, 0.848], [1, 1.01], [0.848, 1.01]]));
          els.pad.setAttribute("rx", (g.W * 0.08).toFixed(1));

          var dt = Math.min((now - last) / 1000, 1 / 30);
          last = now;
          step(dt);
          raf = requestAnimationFrame(loop);
        }
        window.addEventListener("resize", sizeCanvas);
        sizeCanvas();
        raf = requestAnimationFrame(loop);

        return {
          resize: sizeCanvas,
          start: function () {

          },
          progress: function (p) {

          fail: function () {

      /*
        The download. Simulated so the experiment works offline (the file itself is real: a
        postcard image generated in the page). To use a real endpoint, swap the body for a
        fetch() reading response.body chunks and call on.progress(received, total).
        Resumable: start(from) continues from a fraction already received.
      */
      window.simulateDownload = function (opts, on) {
        var total = opts.size,
          dur = 8.5,
          failAt = opts.fail ? 0.66 + Math.random() * 0.14 : 2;
        var got = (opts.from || 0) * total,
          mult = 1,
          next = 0,
          t = 0,
          stopped = false,
          lastT = performance.now();
        var id = setInterval(function () {
          if (stopped) return;
          var now = performance.now(),
            dt = Math.min((now - lastT) / 1000, 0.25);
          lastT = now;
          t += dt;
          if (t >= next) {
            var r = Math.random();
            mult =
              r < 0.1 ? 0.08 : r < 0.35 ? 0.55 + Math.random() * 0.3 : 0.9 + Math.random() * 0.7;
            next = t + 0.3 + Math.random() * 0.6;
          }
          got = Math.min(total, got + (total / dur) * mult * dt);
          on.progress(got, total);
          if (got / total >= failAt) {
            stopped = true;
            clearInterval(id);
            on.error(got / total);
          } else if (got >= total) {
            stopped = true;
            clearInterval(id);
            on.done();
          }
        }, 50);
        return {
          abort: function () {
            stopped = true;
            clearInterval(id);
          },
        };

    </script>

      function useDeviceScale() {

        const cardRef = useRef(null);
        const R = {
          fx: useRef(null),

          roadL: useRef(null),

          lines: useRef(null),

          cLavR: useRef(null),

          cCoralSheen: useRef(null),
          cRim: useRef(null),
          box: useRef(null),

        };

        const frame = () => {
          const el = screenRef.current;
          const r = el.getBoundingClientRect();
          return {
            x: r.left,
            y: r.top,
            s: r.width / el.offsetWidth || 1,
            w: el.offsetWidth,
            h: el.offsetHeight,
          };
        };

        useEffect(() => {
          makePostcard().then((blob) =>
            setFile({ url: URL.createObjectURL(blob), size: blob.size })
          );
          const els = {};

          els.tag = document.getElementById("tag");
          drop.current = createDrop(els, {
            size: () => {

            scale: () => frame().s,
            onPhase: (p) => {
              if (p === "open") setLive("Parachute open.");
              if (p === "land") setLive("Landed.");

            onDelivered: () => {

          if (phase === "delivered" || phase === "failed")

        function runDownload(from) {
          const fail = failOnce.current;
          failOnce.current = false;
          dl.current = simulateDownload(
            { size: file.size, from, fail },
            {
              progress: (got, total) => {
                received.current = got / total;
                drop.current.progress(got / total);
                const p = Math.floor((got / total) * 100);
                if (tagNum.current) tagNum.current.textContent = p;
                setPct(p);
              },
              done: () => drop.current.progress(1),
              error: (at) => {
                setFailPct(Math.floor(at * 100));
                drop.current.fail();
                setTimeout(() => {
                  setPhase("failed");
                  setLive("Delivery interrupted.");
                }, 700);
              },
            }
          );
        }

        function startDrop() {
          if (!file) return;
          setPhase("sky");
          setPct(0);
          received.current = 0;
          if (tagNum.current) tagNum.current.textContent = "0";
          setLive("Download started. Your package is on its way.");
          drop.current.start();
          // the card's file icon lifts away as the package appears high in the sky
          setTimeout(() => runDownload(0), 450);
        }
        function retry() {
          setPhase("sky");
          setLive("Retrying.");
          drop.current.resume();
          runDownload(received.current);
        }
        function cancel() {
          dl.current && dl.current.abort();
          drop.current.stop();
          setPhase("card");
          setLive("Download cancelled.");
        }
        function again() {
          drop.current.stop();
          setPhase("card");
        }

        // cursor / finger movement nudges the wind
        function onMove(e) {
          if (phase !== "sky" && phase !== "failed") return;
          const f = frame();
          const lx = (e.clientX - f.x) / f.s;
          drop.current.wind(((lx / f.w) * 2 - 1) * 1.1);
        }

        const inSky = phase !== "card";
        const sizeText = file ? fmtSize(file.size) : "…";
        return (
          <div className="stage">
            <h1 className="sr-only">Package Drop: downloading means something is coming to you.</h1>
            <div style={framed ? { width: DEVICE_W * scale, height: DEVICE_H * scale } : undefined}>
              <div className="device" style={framed ? { transform: `scale(${scale})` } : undefined}>
                <div className="screen" ref={screenRef} onPointerMove={onMove}>
                  <StatusBar />
                  <Scene r={R} on={inSky} />

                  <div className={`hud ${phase === "sky" ? "on" : ""}`} aria-hidden="true">
                    <div className="chip">
                      <span className="pulse" />
                      <span className="label">Incoming</span>
                      <span className="divider" />
                      <span className="what">{FILE_NAME}</span>
                    </div>
                  </div>
                  <div id="tag" className="tag" aria-hidden="true">
                    <b ref={tagNum}>0</b>%
                  </div>

                  <section
                    ref={cardRef}
                    className={`card-view ${inSky ? "away" : ""}`}
                    aria-hidden={inSky}
                    inert={inSky ? "" : undefined}
                  >
                    <p className="kicker">Shared with you</p>
                    <h1>
                      Something&rsquo;s
                      <span className="line2">
                        <span className="band v">on its</span> <span className="band l">way</span>.
                      </span>
                    </h1>
                    <div className="file-block">
                      <div
                        className="doc"
                        style={
                          inSky
                            ? { transform: "translateY(-240px) scale(0.4)", opacity: 0 }
                            : undefined
                        }
                      >
                        <DocIcon size={78} />
                      </div>
                      <p className="name">{FILE_NAME}</p>
                      <p className="meta">
                        {sizeText} &middot; From Mara &middot; Today
                      </p>
                      <button className="dl" onClick={startDrop} disabled={!file}>
                        <span className="main">
                          <Arrow /> Download
                        </span>
                      </button>
                    </div>
                  </section>

                  {phase === "delivered" && file && (
                    <section className="panel" aria-labelledby="done-h">
                      <p className="label">
                        <span className="dot" aria-hidden="true" />
                        Delivered &middot; 100%
                      </p>
                      <h2 id="done-h" className="display">
                        Package delivered.
                      </h2>
                      <div className="file-row">
                        <DocIcon size={30} />
                        <div style={{ minWidth: 0 }}>
                          <p className="n">{FILE_NAME}</p>
                          <p className="label">{sizeText}</p>
                        </div>
                      </div>
                      <div className="actions">
                        <a
                          ref={primaryRef}
                          className="btn primary"
                          href={file.url}
                          target="_blank"
                          rel="noopener"
                        >
                          Open file
                        </a>
                        <button className="btn" onClick={again}>
                          Drop another
                        </button>
                      </div>
                    </section>
                  )}

                  {phase === "failed" && (
                    <section className="panel" aria-labelledby="fail-h">
                      <p className="label">
                        <span className="dot warn" aria-hidden="true" />
                        Stopped at {failPct}%
                      </p>
                      <h2 id="fail-h" className="display">
                        Delivery interrupted.
                      </h2>
                      <p className="lede">
                        The connection dropped while your package was in the air. Retry picks up
                        where it left off.
                      </p>
                      <div className="actions">
                        <button ref={primaryRef} className="btn primary" onClick={retry}>
                          Retry
                        </button>
                        <button className="btn" onClick={cancel}>
                          Cancel
                        </button>
                      </div>
                    </section>
                  )}

                  <div
                    className="sr-only"
                    role="progressbar"
                    aria-label="Download progress"
                    aria-valuemin={0}
                    aria-valuemax={100}
                    aria-valuenow={phase === "delivered" ? 100 : pct}
                  />
                  <p className="sr-only" aria-live="polite">
                    {live}
                  </p>
                  <span className="home-ind" aria-hidden="true" />
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
